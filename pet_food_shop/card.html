<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собачий корм</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <header class="header">
        <div class="empty">
        </div>
    <div class="main-links">
      <div class="nav-links">
        <a href="#features" class="link">Кошик</a>
        <a href="#about" class="link">Інформація</a>
        <a href="#contact" class="link">Контакти</a>
      </div>
      <div class="form-links">
        <a href="/register" class="signup-btn">Увійти або Зареєструватися</a>
      </div>
    </div>
  </header>
     <div class="wrapper">

        <div class="product-card">
            <div class="product-image">
                <img src="" alt="" id="">
            </div>
            <div class="product-info">
                <h1 class="product-title" id="title"></h1>
                <div class="availability">
                    <span class="status-icon" id="status">✔️</span>
                    <span class="status-text">Є в наявності</span>
                </div>
                <p class="product-code">Код: 3456768</p>
                <p class="product-price" id="price">10 258 ₴</p>
                <button class="buy-button">Купити</button>
                <button class="credit-button">Купити в кредит</button>
                <p class="product-price"> від <span id="pricecredit"></span>/міс.</p>
            </div>
        </div>
</body>
</html>
