<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра Динозаврик</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background-color: #f0f0f0;
  }
  .score {
    font-size: 20px;
    margin: 10px;
  }
  .game-container {
    position: relative;
    width: 100%;
    height: 200px;
    background-color: #fff;
    border-top: 2px solid #000;
    border-bottom: 2px solid #000;
    overflow: hidden;
  }
  .dino {
    position: absolute;
    bottom: 0;
    left: 50px;
    width: 40px;
    height: 40px;
    background-color: green;
    border-radius: 5px;
  }
  .cactus {
    position: absolute;
    bottom: 0;
    width: 20px;
    height: 40px;
    background-color: brown;
  }
</style>
</head>
<body>

<div class="score">Счёт: 0</div>
<div class="game-container">
  <div class="dino"></div>
</div>

<script>
  const dino = document.querySelector('.dino');
  const container = document.querySelector('.game-container');
  const scoreDisplay = document.querySelector('.score');
  let isJumping = false;
  let score = 0;
  let speed = 5; // начальная скорость кактусов

  function jump() {
    if (isJumping) return;
    isJumping = true;
    let upInterval = setInterval(() => {
      let dinoBottom = parseInt(dino.style.bottom || 0);
      if (dinoBottom >= 100) { // максимальная высота прыжка
        clearInterval(upInterval);
        let downInterval = setInterval(() => {
          let dinoBottom = parseInt(dino.style.bottom || 0);
          if (dinoBottom <= 0) {
            dino.style.bottom = '0px';
            clearInterval(downInterval);
            isJumping = false;
          } else {
            dino.style.bottom = (dinoBottom - 5) + 'px';
          }
        }, 20);
      } else {
        dino.style.bottom = (dinoBottom + 5) + 'px';
      }
    }, 20);
  }

  function createCactus() {
    const cactus = document.createElement('div');
    cactus.classList.add('cactus');
    container.appendChild(cactus);
    let cactusPosition = container.offsetWidth;
    cactus.style.left = cactusPosition + 'px';

    const moveCactus = setInterval(() => {
      cactusPosition -= speed;
      cactus.style.left = cactusPosition + 'px';

      let dinoLeft = 50;
      let dinoBottom = parseInt(dino.style.bottom || 0);

      // проверка столкновения
      if (cactusPosition < dinoLeft + 40 && cactusPosition + 20 > dinoLeft && dinoBottom < 40) {
        alert('Игра окончена! Счёт: ' + score);
        clearInterval(moveCactus);
        location.reload();
      }

      // когда кактус за экраном
      if (cactusPosition < -20) {
        clearInterval(moveCactus);
        container.removeChild(cactus);
        score++;
        scoreDisplay.textContent = 'Счёт: ' + score;
        speed += 0.5; // увеличиваем скорость после каждого кактуса
      }
    }, 20);

    // создаём следующий кактус через случайный промежуток
    setTimeout(createCactus, Math.random() * 2000 + 1000);
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') jump();
  });

  createCactus();
</script>

</body>
</html>
